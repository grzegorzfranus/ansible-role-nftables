# =============================================================================
# Ansible Role: NFTables - Molecule Verification Playbook
# =============================================================================
# This playbook verifies the installation and configuration of NFTables.
# It performs comprehensive checks of:
# - Package installation and versioning
# - Service status and configuration
# - Configuration files
# - Firewall rules installation and functionality
# - Log management setup
# - Network connectivity with applied rules
#
# Flow:
# 1. Load variables and gather facts
# 2. Verify package installation
# 3. Check service status
# 4. Validate configuration files
# 5. Verify firewall rules
# 6. Test network connectivity
# 7. Verify logging setup
# =============================================================================

---
# -----------------------------------------------------------------------------
# 1. Environment Setup
# -----------------------------------------------------------------------------
- name: molecule | Verify Role
  hosts: all
  gather_facts: true

  vars_files:
    - ../../defaults/main.yml
    - ../../vars/main.yml

  tasks:
    - name: Verify | Gather OS specific variables
      include_vars: "{{ lookup('first_found', params) }}"
      vars:
        params:
          files:
            - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
            - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_major_version'] | lower }}.yml"
            - "{{ ansible_facts['distribution'] | lower }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}.yml"
            - "main.yml"
          paths:
            - "../../vars"

    - name: Verify | Determine if node is in docker-aware mode
      ansible.builtin.set_fact:
        _verify_docker_aware: >-
          {{
            ((ansible_facts['distribution'] == 'Ubuntu' and
              ansible_facts['distribution_version'] in ['24.04', '26.04']) or
             (ansible_facts['distribution'] == 'Rocky' and
              ansible_facts['distribution_major_version'] == '9')) | bool
          }}

    # -----------------------------------------------------------------------------
    # 2. Package Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if nftables package is installed
      ansible.builtin.package:
        name: nftables
        state: present
      register: _package_result_
      ignore_errors: true

    - name: Verify | Check if 'nft' binary is available
      ansible.builtin.command:
        cmd: which nft
      changed_when: false
      register: _binary_result_
      ignore_errors: true

    - name: Verify | Get NFTables version
      ansible.builtin.command:
        cmd: nft --version
      register: _version_result_
      changed_when: false
      ignore_errors: true

    - name: Verify | Show NFTables version
      ansible.builtin.debug:
        var: _version_result_.stdout
      when: _version_result_.rc == 0

    # -----------------------------------------------------------------------------
    # 3. Service Status Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if nftables service is running
      ansible.builtin.service:
        name: nftables
        state: started
      register: _service_result_
      ignore_errors: true

    - name: Verify | Check if nftables service is enabled
      ansible.builtin.service:
        name: nftables
        state: started
        enabled: true
      register: _service_enabled_result_
      ignore_errors: true

    # -----------------------------------------------------------------------------
    # 4. Configuration Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if configuration files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _config_files_result_
      with_items:
        - /etc/nftables/nftables.conf
        - /etc/nftables.conf
        - /etc/nftables/rules/
      ignore_errors: true

    - name: Verify | Get NFTables ruleset
      ansible.builtin.command:
        cmd: nft list ruleset
      register: _ruleset_result_
      changed_when: false
      ignore_errors: true

    - name: Verify | Show current ruleset
      ansible.builtin.debug:
        var: _ruleset_result_.stdout_lines
      when: _ruleset_result_.rc == 0

    # -----------------------------------------------------------------------------
    # 5. Firewall Rules Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check for input chain
      ansible.builtin.command:
        cmd: nft list chain inet filter input
      register: _input_chain_result_
      changed_when: false
      ignore_errors: true

    - name: Verify | Check for output chain
      ansible.builtin.command:
        cmd: nft list chain inet filter output
      register: _output_chain_result_
      changed_when: false
      ignore_errors: true

    - name: Verify | Check for forward chain
      ansible.builtin.command:
        cmd: nft list chain inet filter forward
      register: _forward_chain_result_
      changed_when: false
      ignore_errors: true

    - name: Verify | Check for docker0 bridge forward rule (on docker-aware test node)
      ansible.builtin.command:
        cmd: nft list chain inet filter forward
      register: _docker_forward_check_
      changed_when: false
      when: _verify_docker_aware | bool
      failed_when: "'docker0' not in _docker_forward_check_.stdout"

    - name: Verify | Check for interface matching in user_defined_input chain
      ansible.builtin.command:
        cmd: nft list chain inet filter user_defined_input
      register: _user_input_chain_
      changed_when: false
      failed_when: "'iifname \"lo\"' not in _user_input_chain_.stdout"

    - name: Verify | Check for interface matching in user_defined_output chain
      ansible.builtin.command:
        cmd: nft list chain inet filter user_defined_output
      register: _user_output_chain_
      changed_when: false
      failed_when: "'oifname \"eth0\"' not in _user_output_chain_.stdout"

    - name: Verify | Check NAT table rules (on legacy nodes)
      ansible.builtin.command:
        cmd: nft list table ip nat
      register: _legacy_nat_table_
      changed_when: false
      when: not (_verify_docker_aware | bool)
      failed_when: >
        'dnat to 192.0.2.100:80' not in _legacy_nat_table_.stdout or
        'log prefix "[nftables] : nat : prerouting : "' not in _legacy_nat_table_.stdout or
        'masquerade' not in _legacy_nat_table_.stdout or
        'snat to 203.0.113.2' not in _legacy_nat_table_.stdout or
        'log prefix "[nftables] : nat : postrouting : "' not in _legacy_nat_table_.stdout

    - name: Verify | Check NAT table rules (on docker-aware test node)
      ansible.builtin.command:
        cmd: nft list table inet nftables_nat
      register: _docker_nat_table_
      changed_when: false
      when: _verify_docker_aware | bool
      failed_when: >
        'dnat ip to 192.0.2.100:80' not in _docker_nat_table_.stdout or
        'log prefix "[nftables] : nat : prerouting : "' not in _docker_nat_table_.stdout or
        'masquerade' not in _docker_nat_table_.stdout or
        'snat ip to 203.0.113.2' not in _docker_nat_table_.stdout or
        'log prefix "[nftables] : nat : postrouting : "' not in _docker_nat_table_.stdout

    - name: Verify | Check systemd drop-in file status (on legacy nodes)
      ansible.builtin.stat:
        path: "{{ __nftables_systemd_dropin_path }}"
      register: _dropin_legacy_stat_
      when: not (_verify_docker_aware | bool)

    - name: Verify | Assert systemd drop-in file does not exist (on legacy nodes)
      ansible.builtin.assert:
        that:
          - not _dropin_legacy_stat_.stat.exists
        fail_msg: "Systemd drop-in file unexpectedly exists on legacy node"
        success_msg: "Systemd drop-in file does not exist on legacy node"
      when: not (_verify_docker_aware | bool)

    - name: Verify | Check systemd drop-in file status (on docker-aware test node)
      ansible.builtin.stat:
        path: "{{ __nftables_systemd_dropin_path }}"
      register: _dropin_docker_stat_
      when: _verify_docker_aware | bool

    - name: Verify | Slurp systemd drop-in configuration (on docker-aware test node)
      become: true
      ansible.builtin.slurp:
        src: "{{ __nftables_systemd_dropin_path }}"
      register: _dropin_docker_slurp_
      when:
        - _verify_docker_aware | bool
        - _dropin_docker_stat_.stat.exists

    - name: Verify | Assert systemd drop-in file exists and contains expected directives (on docker-aware test node)
      ansible.builtin.assert:
        that:
          - _dropin_docker_stat_.stat.exists
          - "'ExecStop=-/usr/sbin/nft delete table inet filter' in (_dropin_docker_slurp_.content | b64decode)"
          - "'ExecReload=/usr/sbin/nft -f' in (_dropin_docker_slurp_.content | b64decode)"
        fail_msg: "Systemd drop-in file is missing or does not contain expected directives"
        success_msg: "Systemd drop-in file exists and contains expected directives"
      when: _verify_docker_aware | bool

    - name: Verify | Create foreign probe table (on docker-aware test node)
      become: true
      ansible.builtin.command:
        cmd: nft add table ip foreign_probe
      when: _verify_docker_aware | bool

    - name: Verify | Create chain in foreign probe table (on docker-aware test node)
      become: true
      ansible.builtin.command:
        cmd: "nft add chain ip foreign_probe probe '{ type filter hook input priority 10; policy accept; }'"
      when: _verify_docker_aware | bool

    - name: Verify | Reload nftables service (on docker-aware test node)
      become: true
      ansible.builtin.command:
        cmd: systemctl reload nftables
      when: _verify_docker_aware | bool

    - name: Verify | List nftables tables after reload (on docker-aware test node)
      become: true
      ansible.builtin.command:
        cmd: nft list tables
      register: _tables_after_reload_
      changed_when: false
      when: _verify_docker_aware | bool

    - name: Verify | Assert foreign table preserved after reload (on docker-aware test node)
      ansible.builtin.assert:
        that:
          - "'table ip foreign_probe' in _tables_after_reload_.stdout"
          - "'table inet filter' in _tables_after_reload_.stdout"
        fail_msg: "Foreign probe table or inet filter table missing after reload"
        success_msg: "Foreign probe table and inet filter table preserved after reload"
      when: _verify_docker_aware | bool

    - name: Verify | Restart nftables service (on docker-aware test node)
      become: true
      ansible.builtin.command:
        cmd: systemctl restart nftables
      when: _verify_docker_aware | bool

    - name: Verify | List nftables tables after restart (on docker-aware test node)
      become: true
      ansible.builtin.command:
        cmd: nft list tables
      register: _tables_after_restart_
      changed_when: false
      when: _verify_docker_aware | bool

    - name: Verify | Assert foreign table preserved after restart (on docker-aware test node)
      ansible.builtin.assert:
        that:
          - "'table ip foreign_probe' in _tables_after_restart_.stdout"
          - "'table inet filter' in _tables_after_restart_.stdout"
        fail_msg: "Foreign probe table or inet filter table missing after restart"
        success_msg: "Foreign probe table and inet filter table preserved after restart"
      when: _verify_docker_aware | bool

    - name: Verify | Delete foreign probe table (on docker-aware test node)
      become: true
      ansible.builtin.command:
        cmd: nft delete table ip foreign_probe
      when: _verify_docker_aware | bool

    # -----------------------------------------------------------------------------
    # 6. Logging Configuration Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if log directory exists
      ansible.builtin.stat:
        path: "/var/log/nftables"
      register: _logdir_result_
      ignore_errors: true

    - name: Verify | Check if logrotate configuration exists
      ansible.builtin.stat:
        path: "/etc/logrotate.d/nftables"
      register: _logrotate_result_
      ignore_errors: true

    - name: Verify | Slurp rendered logrotate configuration
      become: true
      ansible.builtin.slurp:
        src: "/etc/logrotate.d/nftables"
      register: __verify_logrotate_slurp

    - name: Verify | Assert rendered dateformat directive
      ansible.builtin.assert:
        that:
          - "'dateext' in (__verify_logrotate_slurp.content | b64decode)"
          - "'dateformat .%Y-%m-%d' in (__verify_logrotate_slurp.content | b64decode)"
        fail_msg: "Rendered logrotate configuration does not contain the expected dateformat directive"
        success_msg: "Rendered logrotate configuration contains the expected dateformat directive"

    # -----------------------------------------------------------------------------
    # 7. Test Results Summary
    # -----------------------------------------------------------------------------
    - name: Verify | Summarize test results
      ansible.builtin.debug:
        msg: |
          NFTables Verification Summary:
          ----------------------------
          Package Installed: {{ _package_result_.failed | default(true) | ternary('FAIL', 'PASS') }}
          Binary Available: {{ _binary_result_.rc | default(1) | ternary('FAIL', 'PASS') }}
          Service Running: {{ _service_result_.failed | default(true) | ternary('FAIL', 'PASS') }}
          Service Enabled: {{ _service_enabled_result_.failed | default(true) | ternary('FAIL', 'PASS') }}
          Input Chain: {{ _input_chain_result_.rc | default(1) | ternary('FAIL', 'PASS') }}
          Output Chain: {{ _output_chain_result_.rc | default(1) | ternary('FAIL', 'PASS') }}
          Forward Chain: {{ _forward_chain_result_.rc | default(1) | ternary('FAIL', 'PASS') }}
          Log Directory: {{ _logdir_result_.stat.exists | default(false) | ternary('PASS', 'FAIL') }}
          Logrotate Config: {{ _logrotate_result_.stat.exists | default(false) | ternary('PASS', 'FAIL') }}
