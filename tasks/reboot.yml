---
# =============================================================================
# Ansible Role: NFTables - Tasks: System Reboot
# =============================================================================
# Manages system reboot execution, connection polling, and post-reboot delays.
# =============================================================================

- name: NFTables | reboot | Reboot system and wait until available
  become: true
  ansible.builtin.reboot:
    msg: "{{ nftables_reboot_message | default('Reboot initialized by Ansible') }}"
    connect_timeout: "{{ nftables_reboot_connect_timeout | default('60') | int }}"
    reboot_timeout: "{{ nftables_reboot_wait_timeout | default('300') | int }}"
    pre_reboot_delay: "{{ nftables_reboot_wait_delay | default('10') | int }}"
    post_reboot_delay: "{{ (nftables_reboot_interval | default(true)) | ternary(nftables_reboot_interval_seconds | default('10'), 0) | int }}"
  register: __nftables_reboot_result
  when: >
    nftables_reboot_wait | default(true) | bool

# Justification: Use shell module to trigger reboot asynchronously without blocking/waiting
# because the native reboot module requires waiting for the host to come back.
- name: NFTables | reboot | Trigger reboot without waiting
  become: true
  ansible.builtin.shell: |
    sleep 2 && shutdown -r now "{{ nftables_reboot_message | default('Reboot initialized by Ansible') }}"
  async: 1
  poll: 0
  changed_when: true
  when: >
    not (nftables_reboot_wait | default(true) | bool)

- name: NFTables | reboot | Report reboot completion time
  ansible.builtin.debug:
    msg: "The system rebooted in {{ __nftables_reboot_result.elapsed }} seconds."
  when:
    - not (__nftables_reboot_result.skipped | default(false) | bool)
    - __nftables_reboot_result.elapsed is defined
