---
# =============================================================================
# Ansible Role: NFTables - Tasks: Configuration
# =============================================================================
# Configures NFTables service state, directories, configuration files, and rsyslog integration.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Service Management
# -----------------------------------------------------------------------------
- name: NFTables | configure | Enable NFTables service on system startup
  become: true
  ansible.builtin.service:
    name: "{{ __nftables_service_name }}"
    state: started
    enabled: true
  when: >
    nftables_service_enabled | default(false)

- name: NFTables | configure | Disable NFTables service on system startup
  become: true
  ansible.builtin.service:
    name: "{{ __nftables_service_name }}"
    state: stopped
    enabled: false
  when: >
    not nftables_service_enabled | default(false)

# -----------------------------------------------------------------------------
# 2. Directory Structure
# -----------------------------------------------------------------------------
- name: NFTables | configure | Create directory for rules
  become: true
  ansible.builtin.file:
    path: "{{ __nftables_rules_directory_path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# -----------------------------------------------------------------------------
# 3. Main Configuration
# -----------------------------------------------------------------------------
- name: NFTables | configure | Deploy configuration file
  become: true
  ansible.builtin.template:
    src: templates/nftables.conf.j2
    dest: "{{ __nftables_config_path }}"
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: nft -c -f %s
  notify: NFTables | handlers | Restart nftables service

# -----------------------------------------------------------------------------
# 4. Logging Setup
# -----------------------------------------------------------------------------
- name: NFTables | configure | Create directory for log files
  become: true
  ansible.builtin.file:
    path: "{{ __nftables_log_directory_path }}"
    state: directory
    owner: "{{ __nftables_log_directory_user }}"
    group: "{{ __nftables_log_directory_group }}"
    mode: "0750"

- name: NFTables | configure | Deploy rsyslog configuration file
  become: true
  ansible.builtin.template:
    src: templates/rsyslog/nftables.conf.j2
    dest: "{{ __nftables_rsyslog_config_path }}"
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: NFTables | handlers | Restart rsyslog service
