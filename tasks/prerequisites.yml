---
# =============================================================================
# Ansible Role: NFTables - Tasks: Prerequisites
# =============================================================================
# Prepares the system environment by configuring rsyslog and disabling conflicting services.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Rsyslog Setup
# -----------------------------------------------------------------------------
# Note: 'update_cache' is not a documented parameter of ansible.builtin.package; it is passed
# through to the backend module (apt/dnf), both of which support it. Revisit if support for a
# package manager without that parameter is ever added.
- name: NFTables | prerequisites | Install rsyslog package
  become: true
  ansible.builtin.package:
    name: rsyslog
    state: present
    update_cache: true
  register: __nftables_rsyslog_package
  retries: 3
  delay: 5
  until: __nftables_rsyslog_package is succeeded

- name: NFTables | prerequisites | Ensure service is enabled
  become: true
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true

# -----------------------------------------------------------------------------
# 2. Conflicting Firewall Services
# -----------------------------------------------------------------------------
- name: NFTables | prerequisites | Gather service facts
  become: true
  ansible.builtin.service_facts:

- name: NFTables | prerequisites | Stop and disable conflicting firewall services
  become: true
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - firewalld
    - iptables
    - netfilter-persistent
    - ufw
  loop_control:
    label: "{{ item }}"
  when: >
    ansible_facts.services[item + '.service'] is defined and
    (
      ansible_facts.services[item + '.service'].state == 'running' or
      ansible_facts.services[item + '.service'].status == 'enabled'
    )
