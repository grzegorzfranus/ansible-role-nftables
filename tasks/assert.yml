- name: NFTables | assert | Validate user-defined rules interface fields
  ansible.builtin.assert:
    that:
      - >
        (
          (nftables_user_defined_input_rules | selectattr('in_interface', 'defined') | list) +
          (nftables_user_defined_forward_rules | selectattr('in_interface', 'defined') | list)
        ) | map(attribute='in_interface') | map('type_debug') | select('equalto', 'str') | list | length ==
        (
          (nftables_user_defined_input_rules | selectattr('in_interface', 'defined') | list) +
          (nftables_user_defined_forward_rules | selectattr('in_interface', 'defined') | list)
        ) | length
      - >
        (
          (nftables_user_defined_forward_rules | selectattr('out_interface', 'defined') | list) +
          (nftables_user_defined_output_rules | selectattr('out_interface', 'defined') | list)
        ) | map(attribute='out_interface') | map('type_debug') | select('equalto', 'str') | list | length ==
        (
          (nftables_user_defined_forward_rules | selectattr('out_interface', 'defined') | list) +
          (nftables_user_defined_output_rules | selectattr('out_interface', 'defined') | list)
        ) | length
      - (nftables_user_defined_input_rules | selectattr('out_interface', 'defined') | list | length) == 0
      - (nftables_user_defined_output_rules | selectattr('in_interface', 'defined') | list | length) == 0
    fail_msg: >-
      User-defined rules interface configuration is invalid: 'in_interface' and 'out_interface' must be strings;
      'in_interface' is only supported in input and forward rules;
      'out_interface' is only supported in forward and output rules
    success_msg: "User-defined rules interface fields validated"

# -----------------------------------------------------------------------------
# 8. NAT Rules Settings
# -----------------------------------------------------------------------------
# Validates Destination NAT (DNAT), Source NAT (SNAT), masquerade, and redirect rules.

- name: NFTables | assert | Validate NAT enabled flags
  ansible.builtin.assert:
    that:
      - nftables_nat_prerouting_enabled is defined
      - nftables_nat_prerouting_enabled is boolean
      - nftables_nat_postrouting_enabled is defined
      - nftables_nat_postrouting_enabled is boolean
      - nftables_nat_output_enabled is defined
      - nftables_nat_output_enabled is boolean
    fail_msg: "NAT enabled flags must be boolean values"
    success_msg: "NAT enabled flags validated"

- name: NFTables | assert | Validate NAT rules list structure
  ansible.builtin.assert:
    that:
      - nftables_nat_prerouting_rules is defined
      - nftables_nat_prerouting_rules is sequence
      - nftables_nat_postrouting_rules is defined
      - nftables_nat_postrouting_rules is sequence
      - nftables_nat_output_rules is defined
      - nftables_nat_output_rules is sequence
      - not (nftables_nat_prerouting_enabled | bool) or (nftables_nat_prerouting_rules | length > 0)
      - not (nftables_nat_postrouting_enabled | bool) or (nftables_nat_postrouting_rules | length > 0)
      - not (nftables_nat_output_enabled | bool) or (nftables_nat_output_rules | length > 0)
      - >
        (
          nftables_nat_prerouting_rules +
          nftables_nat_postrouting_rules +
          nftables_nat_output_rules
        ) | map('type_debug') | select('equalto', 'dict') | list | length ==
        (
          nftables_nat_prerouting_rules +
          nftables_nat_postrouting_rules +
          nftables_nat_output_rules
        ) | length
    fail_msg: >-
      NAT rules must be sequences of dictionary rule definitions;
      when prerouting, postrouting, or output NAT is enabled, the corresponding rules list must not be empty
    success_msg: "NAT rules list structures validated"

- name: NFTables | assert | Validate NAT rules have mandatory nat_action
  ansible.builtin.assert:
    that:
      - (nftables_nat_prerouting_rules | rejectattr('nat_action', 'defined') | list | length) == 0
      - (nftables_nat_postrouting_rules | rejectattr('nat_action', 'defined') | list | length) == 0
      - (nftables_nat_output_rules | rejectattr('nat_action', 'defined') | list | length) == 0
    fail_msg: "Every rule in 'nftables_nat_prerouting_rules', 'nftables_nat_postrouting_rules', and 'nftables_nat_output_rules' must define 'nat_action'"
    success_msg: "Mandatory nat_action validated in all NAT rules"

- name: NFTables | assert | Validate NAT prerouting rule actions
  ansible.builtin.assert:
    that:
      - >
        (
          nftables_nat_prerouting_rules
          | selectattr('nat_action', 'defined')
          | map(attribute='nat_action')
          | select()
          | list
          | difference(['dnat', 'redirect'])
          | length == 0
        )
    fail_msg: "NAT prerouting rules 'nat_action' must be one of: dnat, redirect"
    success_msg: "NAT prerouting rule actions validated"

- name: NFTables | assert | Validate NAT output rule actions
  ansible.builtin.assert:
    that:
      - >
        (
          nftables_nat_output_rules
          | selectattr('nat_action', 'defined')
          | map(attribute='nat_action')
          | select()
          | list
          | difference(['dnat', 'redirect'])
          | length == 0
        )
    fail_msg: "NAT output rules 'nat_action' must be one of: dnat, redirect"
    success_msg: "NAT output rule actions validated"

- name: NFTables | assert | Validate NAT postrouting rule actions
  ansible.builtin.assert:
    that:
      - >
        (
          nftables_nat_postrouting_rules
          | selectattr('nat_action', 'defined')
          | map(attribute='nat_action')
          | select()
          | list
          | difference(['snat', 'masquerade'])
          | length == 0
        )
