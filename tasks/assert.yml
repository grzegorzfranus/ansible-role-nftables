        ) | select() | flatten | select() | list | length
    fail_msg: "User-defined rules 'source' and 'destination' must be strings or lists of strings"
    success_msg: "User-defined rules source and destination fields validated"

- name: NFTables | assert | Validate user-defined rules source and destination IP format
  ansible.builtin.assert:
    that:
      - >
        (nftables_ipv6_enabled | default(false) | bool) or
        (
          (
            (
              (nftables_user_defined_input_rules | selectattr('source', 'defined') | map(attribute='source') | list) +
              (nftables_user_defined_forward_rules | selectattr('source', 'defined') | map(attribute='source') | list) +
              (nftables_user_defined_output_rules | selectattr('source', 'defined') | map(attribute='source') | list)
            )
            | flatten
            | map('string')
            | map('regex_search', '^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[1-2][0-9]|3[0-2]))?$')
