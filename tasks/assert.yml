---
# =============================================================================
# Ansible Role: NFTables - Tasks: Assertions
# =============================================================================
# Validates role configuration parameters and preflight requirements.
# Basic type/choice validation is handled by meta/argument_specs.yml.
#
# Sections:
#   0. Preflight & OS Support
#   1. General Settings
#   2. Logging Configuration
#   3. Base Filter Chain Policies
#   4. ICMP/Ping Settings
#   5. Basic Access Control Settings
#   6. Cluster Communication Settings
#   7. User-Defined Rules Settings
#   8. NAT Rules Settings
# =============================================================================

# -----------------------------------------------------------------------------
# 0. Preflight & OS Support
# -----------------------------------------------------------------------------
# Validates supported operating system distribution family and internal variables.

- name: NFTables | assert | Validate supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] is defined
      - ansible_facts['os_family'] | lower in ['redhat', 'debian']
    fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] | default('undefined') }}'. Supported: RedHat, Debian"
    success_msg: "OS family: {{ ansible_facts['os_family'] }}"

- name: NFTables | assert | Validate internal OS-specific variables are loaded
  ansible.builtin.assert:
    that:
      - __nftables_package_name is defined
      - __nftables_service_name is defined
      - __nftables_config_path is defined
      - __nftables_rules_directory_path is defined
      - __nftables_log_directory_path is defined
      - __nftables_system_log_path is defined
      - __nftables_log_directory_user is defined
      - __nftables_log_directory_group is defined
      - __nftables_logrotate_config_path is defined
      - __nftables_rsyslog_config_path is defined
    fail_msg: >-
      Internal OS-specific variables are not loaded.
      Ensure that vars/ files are correctly structured for this OS family.
    success_msg: "All internal OS-specific variables are loaded"

# -----------------------------------------------------------------------------
# 1. General Settings
# -----------------------------------------------------------------------------
# Validates core service state, feature flags, and reboot parameters.

- name: NFTables | assert | Validate service enabled parameter
  ansible.builtin.assert:
    that:
      - nftables_service_enabled is defined
      - nftables_service_enabled is boolean
    fail_msg: "nftables_service_enabled must be a boolean (true/false)"
    success_msg: "Service enabled flag validated: {{ nftables_service_enabled }}"

- name: NFTables | assert | Validate logrotate configuration flag
  ansible.builtin.assert:
    that:
      - nftables_configure_logrotate is defined
      - nftables_configure_logrotate is boolean
    fail_msg: "nftables_configure_logrotate must be a boolean (true/false)"
    success_msg: "Logrotate configuration flag validated: {{ nftables_configure_logrotate }}"

- name: NFTables | assert | Validate security rules configuration flag
  ansible.builtin.assert:
    that:
      - nftables_configure_security_rules is defined
      - nftables_configure_security_rules is boolean
    fail_msg: "nftables_configure_security_rules must be a boolean (true/false)"
    success_msg: "Security rules configuration flag validated: {{ nftables_configure_security_rules }}"

- name: NFTables | assert | Validate docker-aware configuration flag
  ansible.builtin.assert:
    that:
      - nftables_docker_aware is defined
      - nftables_docker_aware is boolean
    fail_msg: "nftables_docker_aware must be a boolean (true/false)"
    success_msg: "Docker-aware mode flag validated: {{ nftables_docker_aware }}"

- name: NFTables | assert | Validate enable ipv6 flag
  ansible.builtin.assert:
    that:
      - nftables_ipv6_enabled is defined
      - nftables_ipv6_enabled is boolean
    fail_msg: "nftables_ipv6_enabled must be a boolean (true/false)"
    success_msg: "Enable IPv6 flag validated: {{ nftables_ipv6_enabled }}"

- name: NFTables | assert | Validate docker-aware bridge interfaces
  ansible.builtin.assert:
    that:
      - nftables_docker_aware_bridge_interfaces is defined
      - nftables_docker_aware_bridge_interfaces is sequence
      - >
        (
          nftables_docker_aware_bridge_interfaces
          | map('type_debug')
          | select('equalto', 'str')
          | list
          | length
        ) == (nftables_docker_aware_bridge_interfaces | length)
    fail_msg: "nftables_docker_aware_bridge_interfaces must be a list of interface name strings"
    success_msg: "Docker-aware bridge interfaces list validated"

- name: NFTables | assert | Validate reboot parameters
  ansible.builtin.assert:
    that:
      - nftables_reboot_required is defined
      - nftables_reboot_required is boolean
      - nftables_reboot_message is defined
      - nftables_reboot_message is string
      - nftables_reboot_message | length > 0
      - nftables_reboot_wait is defined
      - nftables_reboot_wait is boolean
      - nftables_reboot_wait_timeout is defined
      - nftables_reboot_wait_timeout is integer
      - nftables_reboot_wait_timeout >= 1
      - nftables_reboot_connect_timeout is defined
      - nftables_reboot_connect_timeout is integer
      - nftables_reboot_connect_timeout >= 1
      - nftables_reboot_wait_delay is defined
      - nftables_reboot_wait_delay is integer
      - nftables_reboot_wait_delay >= 0
      - nftables_reboot_interval is defined
      - nftables_reboot_interval is boolean
      - nftables_reboot_interval_seconds is defined
      - nftables_reboot_interval_seconds is integer
      - nftables_reboot_interval_seconds >= 0
    fail_msg: "Reboot configuration parameters are invalid, empty, or out of range"
    success_msg: "Reboot configuration parameters validated"

# -----------------------------------------------------------------------------
# 2. Logging Configuration
# -----------------------------------------------------------------------------
# Validates log rotation options and archive directory settings.

- name: NFTables | assert | Validate logrotate options
  ansible.builtin.assert:
    that:
      - nftables_logrotate_options is defined
      - nftables_logrotate_options is mapping
      - nftables_logrotate_options.archive_directory_path is defined
      - nftables_logrotate_options.archive_directory_path is string
      - nftables_logrotate_options.archive_directory_path is match('^/')
      - nftables_logrotate_options.frequency is defined
      - nftables_logrotate_options.frequency in ["hourly", "daily", "weekly", "monthly"]
      - nftables_logrotate_options.count is defined
      - nftables_logrotate_options.count is integer
      - nftables_logrotate_options.count >= 1
      - nftables_logrotate_options.missingok is defined
      - nftables_logrotate_options.missingok is boolean
      - nftables_logrotate_options.compress is defined
      - nftables_logrotate_options.compress is boolean
      - nftables_logrotate_options.nocreate is defined
      - nftables_logrotate_options.nocreate is boolean
      - nftables_logrotate_options.dateext is defined
      - nftables_logrotate_options.dateext is boolean
      - not (nftables_logrotate_options.dateext | bool) or
        (nftables_logrotate_options.dateformat is defined and
         nftables_logrotate_options.dateformat is string and
         nftables_logrotate_options.dateformat | length > 0)
    fail_msg: >-
      nftables_logrotate_options contains invalid or incomplete settings
      (archive_directory_path must be absolute path starting with '/', count >= 1,
      dateformat must be a non-empty string when dateext is true)
    success_msg: "Logrotate options validated"

# -----------------------------------------------------------------------------
# 3. Base Filter Chain Policies
# -----------------------------------------------------------------------------
# Validates default chain verdicts and dropped packet logging parameters.

- name: NFTables | assert | Validate input chain default policy
  ansible.builtin.assert:
    that:
      - nftables_input_default_policy is defined
      - nftables_input_default_policy is string
      - nftables_input_default_policy in ["accept", "drop", "reject"]
    fail_msg: "nftables_input_default_policy must be one of: accept, drop, reject"
    success_msg: "Input default policy validated: {{ nftables_input_default_policy }}"

- name: NFTables | assert | Validate forward chain default policy
  ansible.builtin.assert:
    that:
      - nftables_forward_default_policy is defined
      - nftables_forward_default_policy is string
      - nftables_forward_default_policy in ["accept", "drop", "reject"]
    fail_msg: "nftables_forward_default_policy must be one of: accept, drop, reject"
    success_msg: "Forward default policy validated: {{ nftables_forward_default_policy }}"

- name: NFTables | assert | Validate output chain default policy
  ansible.builtin.assert:
    that:
      - nftables_output_default_policy is defined
      - nftables_output_default_policy is string
      - nftables_output_default_policy in ["accept", "drop", "reject"]
    fail_msg: "nftables_output_default_policy must be one of: accept, drop, reject"
    success_msg: "Output default policy validated: {{ nftables_output_default_policy }}"

- name: NFTables | assert | Validate logging options for dropped packets
  ansible.builtin.assert:
    that:
      - nftables_log_input_dropped is defined
      - nftables_log_input_dropped is boolean
      - nftables_log_forward_dropped is defined
      - nftables_log_forward_dropped is boolean
      - nftables_log_output_dropped is defined
      - nftables_log_output_dropped is boolean
      - nftables_log_input_dropped_rate_limit is defined
      - nftables_log_input_dropped_rate_limit is string
      - nftables_log_input_dropped_rate_limit is match('^\d+/(second|minute|hour|day)$')
      - nftables_log_input_dropped_burst is defined
      - nftables_log_input_dropped_burst is integer
      - nftables_log_input_dropped_burst >= 1
      - nftables_log_forward_dropped_rate_limit is defined
      - nftables_log_forward_dropped_rate_limit is string
      - nftables_log_forward_dropped_rate_limit is match('^\d+/(second|minute|hour|day)$')
      - nftables_log_forward_dropped_burst is defined
      - nftables_log_forward_dropped_burst is integer
      - nftables_log_forward_dropped_burst >= 1
      - nftables_log_output_dropped_rate_limit is defined
      - nftables_log_output_dropped_rate_limit is string
      - nftables_log_output_dropped_rate_limit is match('^\d+/(second|minute|hour|day)$')
      - nftables_log_output_dropped_burst is defined
      - nftables_log_output_dropped_burst is integer
      - nftables_log_output_dropped_burst >= 1
    fail_msg: >-
      Dropped packet logging options contain invalid values
      (rate limits must match format 'X/period' where period is second, minute, hour, day)
    success_msg: "Dropped packet logging options validated"

# -----------------------------------------------------------------------------
# 4. ICMP/Ping Settings
# -----------------------------------------------------------------------------
# Validates ICMP and ICMPv6 echo request rate limits and bursts.

- name: NFTables | assert | Validate input ICMP/ping settings
  ansible.builtin.assert:
    that:
      - nftables_ping_input is defined
      - nftables_ping_input is mapping
      - nftables_ping_input.enabled is defined
      - nftables_ping_input.enabled is boolean
      - nftables_ping_input.rate_limit is defined
      - nftables_ping_input.rate_limit is string
      - nftables_ping_input.rate_limit is match('^\d+/(second|minute|hour|day)$')
      - nftables_ping_input.burst is defined
      - nftables_ping_input.burst is integer
      - nftables_ping_input.burst >= 1
      - nftables_ping_input.log is defined
      - nftables_ping_input.log is boolean
      - nftables_ping_input.comment is defined
      - nftables_ping_input.comment is string
    fail_msg: "nftables_ping_input settings are invalid (rate limit must match format 'X/period')"
    success_msg: "Input ICMP/ping settings validated"

- name: NFTables | assert | Validate output ICMP/ping settings
  ansible.builtin.assert:
    that:
      - nftables_ping_output is defined
      - nftables_ping_output is mapping
      - nftables_ping_output.enabled is defined
      - nftables_ping_output.enabled is boolean
      - nftables_ping_output.rate_limit is defined
      - nftables_ping_output.rate_limit is string
      - nftables_ping_output.rate_limit is match('^\d+/(second|minute|hour|day)$')
      - nftables_ping_output.burst is defined
      - nftables_ping_output.burst is integer
      - nftables_ping_output.burst >= 1
      - nftables_ping_output.log is defined
      - nftables_ping_output.log is boolean
      - nftables_ping_output.comment is defined
      - nftables_ping_output.comment is string
    fail_msg: "nftables_ping_output settings are invalid (rate limit must match format 'X/period')"
    success_msg: "Output ICMP/ping settings validated"

# -----------------------------------------------------------------------------
# 5. Basic Access Control Settings
# -----------------------------------------------------------------------------
# Validates reserved address ranges for anti-spoofing protection.

- name: NFTables | assert | Validate blocked reserved IP ranges
  ansible.builtin.assert:
    that:
      - nftables_blocked_reserved_ranges is defined
      - nftables_blocked_reserved_ranges is sequence
      - >
        (
          nftables_blocked_reserved_ranges
          | map('string')
          | map('regex_search', '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$')
          | select('string')
          | list | length
        ) == (nftables_blocked_reserved_ranges | length)
    fail_msg: "nftables_blocked_reserved_ranges must be a list of valid IPv4 CIDR strings"
    success_msg: "Blocked reserved ranges list validated"

# -----------------------------------------------------------------------------
# 6. Cluster Communication Settings
# -----------------------------------------------------------------------------
# Validates cluster node IP addresses and node-to-node firewall rules.

- name: NFTables | assert | Validate cluster mode configuration flag
  ansible.builtin.assert:
    that:
      - nftables_cluster_enabled is defined
      - nftables_cluster_enabled is boolean
    fail_msg: "nftables_cluster_enabled must be a boolean (true/false)"
    success_msg: "Cluster enabled flag validated: {{ nftables_cluster_enabled }}"

- name: NFTables | assert | Validate cluster nodes list
  ansible.builtin.assert:
    that:
      - nftables_cluster_nodes is defined
      - nftables_cluster_nodes is sequence
      - not (nftables_cluster_enabled | bool) or (nftables_cluster_nodes | length > 0)
      - >
        (nftables_ipv6_enabled | default(false) | bool) or
        (
          (
            nftables_cluster_nodes
            | map('string')
            | map('regex_search', '^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[1-2][0-9]|3[0-2]))?$')
            | select('string')
            | list | length
          ) == (nftables_cluster_nodes | length)
        )
      - >
        not (nftables_ipv6_enabled | default(false) | bool) or
        (
          (
            nftables_cluster_nodes
            | map('string')
            | map('regex_search', '^(([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[1-2][0-9]|3[0-2]))?|[a-fA-F0-9:]+(/([0-9]|[1-9][0-9]|1[0-1][0-9]|12[0-8]))?)$')
            | select('string')
            | list | length
          ) == (nftables_cluster_nodes | length)
        )
    fail_msg: >-
      nftables_cluster_nodes must not be empty when cluster mode is enabled;
      all elements must be valid IP addresses or CIDRs (IPv4, or IPv6 when nftables_ipv6_enabled is true)
    success_msg: "Cluster nodes list validated"

- name: NFTables | assert | Validate cluster communication rules
  ansible.builtin.assert:
    that:
      - nftables_cluster_rules is defined
      - nftables_cluster_rules is sequence
      - not (nftables_cluster_enabled | bool) or (nftables_cluster_rules | length > 0)
      - (nftables_cluster_rules | map('type_debug') | select('equalto', 'dict') | list | length) == (nftables_cluster_rules | length)
      - (nftables_cluster_rules | map(attribute='port') | list | reject('number') | list | length) == 0
      - >
        (
          nftables_cluster_rules
          | selectattr('protocol', 'defined')
          | map(attribute='protocol')
          | select()
          | list
          | difference(['tcp', 'udp'])
          | length == 0
        )
      - >
        (
          nftables_cluster_rules
          | selectattr('rate_limit', 'defined')
          | map(attribute='rate_limit')
          | select()
          | map('string')
          | map('regex_search', '^\d+/(second|minute|hour|day)$')
          | select('string')
          | list | length
        ) == (
          nftables_cluster_rules
          | selectattr('rate_limit', 'defined')
          | select()
          | list | length
        )
    fail_msg: >-
      nftables_cluster_rules must not be empty when cluster mode is enabled;
      each rule must be a dict with numeric 'port'; protocol must be 'tcp' or 'udp'; rate_limit must match format 'X/period'
    success_msg: "Cluster communication rules structure validated"

- name: NFTables | assert | Validate cluster rules optional field types
  ansible.builtin.assert:
    that:
      - >
        (
          nftables_cluster_rules
          | selectattr('counter', 'defined')
          | map(attribute='counter')
          | map('type_debug')
          | select('equalto', 'bool')
          | list | length
        ) == (
          nftables_cluster_rules
          | selectattr('counter', 'defined')
          | list | length
        )
      - >
        (
          nftables_cluster_rules
          | selectattr('log', 'defined')
          | map(attribute='log')
          | map('type_debug')
          | select('equalto', 'bool')
          | list | length
        ) == (
          nftables_cluster_rules
          | selectattr('log', 'defined')
          | list | length
        )
      - >
        (
          nftables_cluster_rules
          | selectattr('comment', 'defined')
          | map(attribute='comment')
          | map('type_debug')
          | select('equalto', 'str')
          | list | length
        ) == (
          nftables_cluster_rules
          | selectattr('comment', 'defined')
          | list | length
        )
    fail_msg: "Cluster rules 'counter' and 'log' must be boolean values, 'comment' must be a string"
    success_msg: "Cluster rules optional field types validated"

- name: NFTables | assert | Validate cluster rules burst requires rate_limit
  ansible.builtin.assert:
    that:
      - >
        (
          nftables_cluster_rules | selectattr('burst', 'defined') | list
        ) | rejectattr('rate_limit', 'defined') | rejectattr('limit', 'defined') | list | length == 0
    fail_msg: "Cluster rules specifying 'burst' must also specify 'rate_limit'"
    success_msg: "Cluster rules burst and rate_limit dependencies validated"

# -----------------------------------------------------------------------------
# 7. User-Defined Rules Settings
# -----------------------------------------------------------------------------
# Validates custom user-defined firewall rules across input, forward, and output chains.

- name: NFTables | assert | Validate user-defined rules enabled flags
  ansible.builtin.assert:
    that:
      - nftables_user_defined_input_enabled is defined
      - nftables_user_defined_input_enabled is boolean
      - nftables_user_defined_forward_enabled is defined
      - nftables_user_defined_forward_enabled is boolean
      - nftables_user_defined_output_enabled is defined
      - nftables_user_defined_output_enabled is boolean
    fail_msg: "User-defined rules enabled flags must be boolean values"
    success_msg: "User-defined rules enabled flags validated"

- name: NFTables | assert | Validate user-defined rules list structure
  ansible.builtin.assert:
    that:
      - nftables_user_defined_input_rules is defined
      - nftables_user_defined_input_rules is sequence
      - nftables_user_defined_forward_rules is defined
      - nftables_user_defined_forward_rules is sequence
      - nftables_user_defined_output_rules is defined
      - nftables_user_defined_output_rules is sequence
      - >
        (
          nftables_user_defined_input_rules +
          nftables_user_defined_forward_rules +
          nftables_user_defined_output_rules
        ) | map('type_debug') | select('equalto', 'dict') | list | length ==
        (
          nftables_user_defined_input_rules +
          nftables_user_defined_forward_rules +
          nftables_user_defined_output_rules
        ) | length
    fail_msg: "User-defined rules must be sequences of dictionary rule definitions"
    success_msg: "User-defined rules list structures validated"

- name: NFTables | assert | Validate user-defined rules action field
  ansible.builtin.assert:
    that:
      - >
        (
          (
            nftables_user_defined_input_rules +
            nftables_user_defined_forward_rules +
            nftables_user_defined_output_rules
          )
          | selectattr('action', 'defined')
          | map(attribute='action')
          | select()
          | list
          | difference(['accept', 'drop', 'reject', 'return'])
          | length == 0
        )
    fail_msg: "User-defined rules 'action' must be one of: accept, drop, reject, return"
    success_msg: "User-defined rules action fields validated"

- name: NFTables | assert | Validate user-defined rules port field
  ansible.builtin.assert:
    that:
      - >
        (
          (nftables_user_defined_input_rules | selectattr('port', 'defined') | map(attribute='port') | list) +
          (nftables_user_defined_forward_rules | selectattr('port', 'defined') | map(attribute='port') | list) +
          (nftables_user_defined_output_rules | selectattr('port', 'defined') | map(attribute='port') | list)
        ) | select() | map('string') | map('regex_search', '^([0-9]{1,5}(-[0-9]{1,5})?|[0-9]{1,5}(,[0-9]{1,5})*)$') | select('string') | list | length ==
        (
          (nftables_user_defined_input_rules | selectattr('port', 'defined') | map(attribute='port') | list) +
          (nftables_user_defined_forward_rules | selectattr('port', 'defined') | map(attribute='port') | list) +
          (nftables_user_defined_output_rules | selectattr('port', 'defined') | map(attribute='port') | list)
        ) | select() | list | length
    fail_msg: "User-defined rules 'port' must be a numeric port, range (e.g. 1000-2000), or comma-separated list (e.g. 80,443)"
    success_msg: "User-defined rules port fields validated"

- name: NFTables | assert | Validate user-defined rules protocol is specified when port is defined
  ansible.builtin.assert:
    that:
      - >
        (
          (nftables_user_defined_input_rules | selectattr('port', 'defined') | list) +
          (nftables_user_defined_forward_rules | selectattr('port', 'defined') | list) +
          (nftables_user_defined_output_rules | selectattr('port', 'defined') | list)
        ) | rejectattr('protocol', 'defined') | list | length == 0
    fail_msg: "User-defined rules specifying 'port' must also specify 'protocol' ('tcp' or 'udp')"
    success_msg: "User-defined rules protocol requirement for port validated"

- name: NFTables | assert | Validate user-defined rules source and destination fields
  ansible.builtin.assert:
    that:
      - >
        (
          (nftables_user_defined_input_rules | selectattr('source', 'defined') | list) +
          (nftables_user_defined_forward_rules | selectattr('source', 'defined') | list) +
          (nftables_user_defined_output_rules | selectattr('source', 'defined') | list)
        ) | select() | map(attribute='source') | map('type_debug') | select('string') | map('regex_search', '^(str|list)$') | select('string') | list | length ==
        (
          (nftables_user_defined_input_rules | selectattr('source', 'defined') | list) +
          (nftables_user_defined_forward_rules | selectattr('source', 'defined') | list) +
          (nftables_user_defined_output_rules | selectattr('source', 'defined') | list)
        ) | select() | length
      - >
        (
          (nftables_user_defined_input_rules | selectattr('destination', 'defined') | list) +
          (nftables_user_defined_forward_rules | selectattr('destination', 'defined') | list) +
          (nftables_user_defined_output_rules | selectattr('destination', 'defined') | list)
        ) | select() | map(attribute='destination') | map('type_debug') | select('string') | map('regex_search', '^(str|list)$') | select('string') | list | length ==
        (
          (nftables_user_defined_input_rules | selectattr('destination', 'defined') | list) +
          (nftables_user_defined_forward_rules | selectattr('destination', 'defined') | list) +
          (nftables_user_defined_output_rules | selectattr('destination', 'defined') | list)
        ) | select() | length
      - >
        (
          (nftables_user_defined_input_rules | selectattr('source', 'defined') | selectattr('source', 'sequence') | map(attribute='source') | list) +
          (nftables_user_defined_forward_rules | selectattr('source', 'defined') | selectattr('source', 'sequence') | map(attribute='source') | list) +
          (nftables_user_defined_output_rules | selectattr('source', 'defined') | selectattr('source', 'sequence') | map(attribute='source') | list)
        ) | select() | flatten | map('type_debug') | select('string') | map('regex_search', '^str$') | select('string') | list | length ==
        (
          (nftables_user_defined_input_rules | selectattr('source', 'defined') | selectattr('source', 'sequence') | map(attribute='source') | list) +
          (nftables_user_defined_forward_rules | selectattr('source', 'defined') | selectattr('source', 'sequence') | map(attribute='source') | list) +
          (nftables_user_defined_output_rules | selectattr('source', 'defined') | selectattr('source', 'sequence') | map(attribute='source') | list)
        ) | select() | flatten | select() | list | length
      - >
        (
          (
            nftables_user_defined_input_rules
            | selectattr('destination', 'defined')
            | selectattr('destination', 'sequence')
            | map(attribute='destination')
            | list
          ) +
          (
            nftables_user_defined_forward_rules
            | selectattr('destination', 'defined')
            | selectattr('destination', 'sequence')
