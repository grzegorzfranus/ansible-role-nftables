          | selectattr('nat_action', 'equalto', 'snat')
          | list
        ) | rejectattr('nat_to', 'defined') | list | length == 0
      - >
        (
          nftables_nat_postrouting_rules
          | selectattr('nat_action', 'defined')
          | selectattr('nat_action', 'equalto', 'snat')
          | selectattr('nat_to', 'defined')
          | map(attribute='nat_to')
          | map('string')
          | map('trim')
          | select('equalto', '')
          | list | length == 0
        )
    fail_msg: "NAT 'dnat' and 'snat' rules require a non-empty 'nat_to' target address specification"
    success_msg: "NAT dnat and snat target addresses validated"

- name: NFTables | assert | Validate NAT dnat and snat rules nat_to format
  ansible.builtin.assert:
    that:
      - >
        (
          (
            (nftables_nat_prerouting_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'dnat') | list) +
            (nftables_nat_output_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'dnat') | list)
          )
          | selectattr('nat_to', 'defined')
          | map(attribute='nat_to')
          | map('string')
          | map('regex_search', '^([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]{1,5})?$')
          | select('string')
          | list | length
        ) == (
          (
            (nftables_nat_prerouting_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'dnat') | list) +
            (nftables_nat_output_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'dnat') | list)
          )
          | selectattr('nat_to', 'defined')
          | list | length
        )
      - >
        (
          nftables_nat_postrouting_rules
          | selectattr('nat_action', 'defined')
          | selectattr('nat_action', 'equalto', 'snat')
          | selectattr('nat_to', 'defined')
          | map(attribute='nat_to')
          | map('string')
          | map('regex_search', '^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          | select('string')
          | list | length
        ) == (
          nftables_nat_postrouting_rules
          | selectattr('nat_action', 'defined')
          | selectattr('nat_action', 'equalto', 'snat')
          | selectattr('nat_to', 'defined')
          | list | length
        )
    fail_msg: >-
      NAT 'dnat' nat_to target must match IPv4 format with optional port (e.g. '192.0.2.100:80' or '192.0.2.100');
      NAT 'snat' nat_to target must match IPv4 format without port (e.g. '203.0.113.2')
    success_msg: "NAT dnat and snat target address formats validated"

- name: NFTables | assert | Validate masquerade rules specify out_interface
  ansible.builtin.assert:
    that:
      - >
        (
          nftables_nat_postrouting_rules
          | selectattr('nat_action', 'defined')
          | selectattr('nat_action', 'equalto', 'masquerade')
          | list
