          )
          | map(attribute='redirect_port', default=none)
          | select()
          | map('string')
          | map('regex_search', '^[0-9]{1,5}$')
          | select('string')
          | list | length
        ) == (
          (
            (nftables_nat_prerouting_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'redirect') | list) +
            (nftables_nat_output_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'redirect') | list)
          )
          | map(attribute='redirect_port', default=none)
          | select()
          | list | length
        )
      - >
        (
          (
            (nftables_nat_prerouting_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'redirect') | list) +
            (nftables_nat_output_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'redirect') | list)
          )
          | rejectattr('redirect_port', 'defined')
          | map(attribute='nat_to', default=none)
          | select()
          | map('string')
          | map('regex_search', '^[0-9]{1,5}$')
          | select('string')
          | list | length
        ) == (
          (
            (nftables_nat_prerouting_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'redirect') | list) +
            (nftables_nat_output_rules | selectattr('nat_action', 'defined') | selectattr('nat_action', 'equalto', 'redirect') | list)
          )
          | rejectattr('redirect_port', 'defined')
          | map(attribute='nat_to', default=none)
          | select()
          | list | length
        )
    fail_msg: >-
      NAT 'redirect' rules require a single target port ('redirect_port' or 'nat_to' matching '^[0-9]{1,5}$');
      multi-port lists and ranges are not supported
    success_msg: "NAT redirect target ports validated"

