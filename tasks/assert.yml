              (nftables_user_defined_forward_rules | selectattr('source', 'defined') | map(attribute='source') | list) +
              (nftables_user_defined_output_rules | selectattr('source', 'defined') | map(attribute='source') | list)
            )
            | flatten | length
          )
        )
      - >
        (nftables_ipv6_enabled | default(false) | bool) or
        (
          (
            (
              (nftables_user_defined_input_rules | selectattr('destination', 'defined') | map(attribute='destination') | list) +
              (nftables_user_defined_forward_rules | selectattr('destination', 'defined') | map(attribute='destination') | list) +
              (nftables_user_defined_output_rules | selectattr('destination', 'defined') | map(attribute='destination') | list)
            )
            | flatten
            | map('string')
            | map('regex_search', '^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[1-2][0-9]|3[0-2]))?$')
            | select('string')
            | list | length
          ) == (
            (
              (nftables_user_defined_input_rules | selectattr('destination', 'defined') | map(attribute='destination') | list) +
              (nftables_user_defined_forward_rules | selectattr('destination', 'defined') | map(attribute='destination') | list) +
              (nftables_user_defined_output_rules | selectattr('destination', 'defined') | map(attribute='destination') | list)
            )
            | flatten | length
          )
        )
      - >
        not (nftables_ipv6_enabled | default(false) | bool) or
        (
          (
            (
              (nftables_user_defined_input_rules | selectattr('source', 'defined') | map(attribute='source') | list) +
              (nftables_user_defined_forward_rules | selectattr('source', 'defined') | map(attribute='source') | list) +
              (nftables_user_defined_output_rules | selectattr('source', 'defined') | map(attribute='source') | list)
            )
            | flatten
            | map('string')
            | map('regex_search', '^(([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[1-2][0-9]|3[0-2]))?|[a-fA-F0-9:]+(/([0-9]|[1-9][0-9]|1[0-1][0-9]|12[0-8]))?)$')
            | select('string')
            | list | length
          ) == (
            (
              (nftables_user_defined_input_rules | selectattr('source', 'defined') | map(attribute='source') | list) +
              (nftables_user_defined_forward_rules | selectattr('source', 'defined') | map(attribute='source') | list) +
              (nftables_user_defined_output_rules | selectattr('source', 'defined') | map(attribute='source') | list)
            )
            | flatten | length
          )
        )
      - >
        not (nftables_ipv6_enabled | default(false) | bool) or
        (
          (
            (
              (nftables_user_defined_input_rules | selectattr('destination', 'defined') | map(attribute='destination') | list) +
              (nftables_user_defined_forward_rules | selectattr('destination', 'defined') | map(attribute='destination') | list) +
              (nftables_user_defined_output_rules | selectattr('destination', 'defined') | map(attribute='destination') | list)
            )
            | flatten
            | map('string')
            | map('regex_search', '^(([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[1-2][0-9]|3[0-2]))?|[a-fA-F0-9:]+(/([0-9]|[1-9][0-9]|1[0-1][0-9]|12[0-8]))?)$')
            | select('string')
            | list | length
          ) == (
            (
              (nftables_user_defined_input_rules | selectattr('destination', 'defined') | map(attribute='destination') | list) +
              (nftables_user_defined_forward_rules | selectattr('destination', 'defined') | map(attribute='destination') | list) +
              (nftables_user_defined_output_rules | selectattr('destination', 'defined') | map(attribute='destination') | list)
            )
            | flatten | length
          )
        )
    fail_msg: "User-defined rules 'source' and 'destination' addresses must be valid IP addresses or CIDRs (IPv4, or IPv6 when nftables_ipv6_enabled is true)"
    success_msg: "User-defined rules source and destination IP formats validated"

- name: NFTables | assert | Validate user-defined rules address family compatibility
  ansible.builtin.assert:
    that:
      - >
        (
          (nftables_user_defined_input_rules + nftables_user_defined_forward_rules + nftables_user_defined_output_rules)
          | selectattr('source', 'defined')
          | selectattr('destination', 'defined')
          | selectattr('source', 'search', ':')
          | rejectattr('destination', 'search', ':')
          | list
          | length == 0
        )
      - >
        (
          (nftables_user_defined_input_rules + nftables_user_defined_forward_rules + nftables_user_defined_output_rules)
          | selectattr('source', 'defined')
          | selectattr('destination', 'defined')
          | selectattr('source', 'search', '\\.')
          | rejectattr('destination', 'search', '\\.')
          | list
          | length == 0
        )
      - >
        (
          (nftables_user_defined_input_rules + nftables_user_defined_forward_rules + nftables_user_defined_output_rules)
          | selectattr('source', 'defined')
          | selectattr('destination', 'defined')
          | selectattr('destination', 'search', ':')
          | rejectattr('source', 'search', ':')
          | list
          | length == 0
        )
      - >
        (
          (nftables_user_defined_input_rules + nftables_user_defined_forward_rules + nftables_user_defined_output_rules)
          | selectattr('source', 'defined')
          | selectattr('destination', 'defined')
          | selectattr('destination', 'search', '\\.')
          | rejectattr('source', 'search', '\\.')
          | list
          | length == 0
        )
    fail_msg: >-
      {%- set errors = [] -%}
      {%- for chain_name, r_list in [
            ('input', nftables_user_defined_input_rules),
            ('forward', nftables_user_defined_forward_rules),
            ('output', nftables_user_defined_output_rules)
          ] -%}
        {%- for r in r_list -%}
          {%- if r.source is defined and r.destination is defined -%}
            {%- set s_list = [r.source] if r.source is string else r.source -%}
            {%- set d_list = [r.destination] if r.destination is string else r.destination -%}
            {%- set s_v4 = s_list | reject('search', ':') | list -%}
            {%- set s_v6 = s_list | select('search', ':') | list -%}
            {%- set d_v4 = d_list | reject('search', ':') | list -%}
            {%- set d_v6 = d_list | select('search', ':') | list -%}
            {%- if s_v6 | length > 0 and d_v6 | length == 0 -%}
              {%- set _ = errors.append(
                    "user_defined_" ~ chain_name ~ " rule '" ~ (r.comment | default('unnamed')) ~
                    "': IPv6 addresses in source (" ~ (s_v6 | join(', ')) ~
                    ") have no IPv6 destination (IPv6 rule would be omitted)"
                  ) -%}
            {%- endif -%}
            {%- if s_v4 | length > 0 and d_v4 | length == 0 -%}
              {%- set _ = errors.append(
                    "user_defined_" ~ chain_name ~ " rule '" ~ (r.comment | default('unnamed')) ~
                    "': IPv4 addresses in source (" ~ (s_v4 | join(', ')) ~
                    ") have no IPv4 destination (IPv4 rule would be omitted)"
                  ) -%}
            {%- endif -%}
            {%- if d_v6 | length > 0 and s_v6 | length == 0 -%}
              {%- set _ = errors.append(
                    "user_defined_" ~ chain_name ~ " rule '" ~ (r.comment | default('unnamed')) ~
                    "': IPv6 addresses in destination (" ~ (d_v6 | join(', ')) ~
                    ") have no IPv6 source (IPv6 rule would be omitted)"
                  ) -%}
            {%- endif -%}
            {%- if d_v4 | length > 0 and s_v4 | length == 0 -%}
              {%- set _ = errors.append(
                    "user_defined_" ~ chain_name ~ " rule '" ~ (r.comment | default('unnamed')) ~
                    "': IPv4 addresses in destination (" ~ (d_v4 | join(', ')) ~
                    ") have no IPv4 source (IPv4 rule would be omitted)"
                  ) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      Mismatched address families between source and destination: {{ errors | join('; ') }}
    success_msg: "User-defined rules address family compatibility validated"

- name: NFTables | assert | Validate user-defined rules state field
  ansible.builtin.assert:
    that:
      - >
        (
          (
            nftables_user_defined_input_rules +
