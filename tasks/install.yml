---
# =============================================================================
# Ansible Role: NFTables - Tasks: Installation
# =============================================================================
# Installs the NFTables package on target systems using distribution package names.
# =============================================================================

# -----------------------------------------------------------------------------
# Package Installation
# -----------------------------------------------------------------------------
- name: NFTables | install | Install NFTables package
  become: true
  ansible.builtin.package:
    name: "{{ __nftables_package_name }}"
    state: present
