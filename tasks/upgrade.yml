---
# =============================================================================
# Ansible Role: NFTables - Tasks: Package Upgrade
# =============================================================================
# Upgrades the NFTables package to the latest release and triggers service reload.
# =============================================================================

# -----------------------------------------------------------------------------
# Package Upgrade
# -----------------------------------------------------------------------------
# Justification: 'state: latest' is the explicit purpose of this task file — the
# 'upgrade' role action exists specifically to pull the newest packaged NFTables release.
# ansible-lint's package-latest rule cannot express this intent, hence the scoped noqa.
- name: NFTables | upgrade | Upgrade NFTables package to the latest version  # noqa: package-latest
  become: true
  ansible.builtin.package:
    name: "{{ __nftables_package_name }}"
    state: latest
    update_cache: true
  notify: NFTables | handlers | Restart nftables service
