---
# =============================================================================
# Ansible Role: NFTables - Tasks: Access Control Lists
# =============================================================================
# Deploys and validates modular NFTables firewall rulesets, tables, and chains.
# =============================================================================

- name: NFTables | acl | Clear default NFT files with rules (RedHat-specific)
  become: true
  ansible.builtin.file:
    path: "/etc/nftables/{{ item }}"
    state: absent
  loop:
    - main.nft
    - nat.nft
    - router.nft
  loop_control:
    label: "{{ item }}"
  register: __nftables_default_rules_removed
  when: >
    ansible_facts['os_family'] | lower == "redhat"

- name: NFTables | acl | Deploy security protection rules file
  become: true
  ansible.builtin.template:
    src: rules/firewall.rules.j2
    dest: "{{ __nftables_rules_directory_path }}/10-firewall.rules"
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: nft -c -f %s
  register: __nftables_security_rules
  when: >
    (nftables_configure_security_rules | default(false) | bool)

- name: NFTables | acl | Remove security protection rules file (if exists)
  become: true
  ansible.builtin.file:
    path: "{{ __nftables_rules_directory_path }}/10-firewall.rules"
    state: absent
  register: __nftables_security_rules_removed
  when: >
    not (nftables_configure_security_rules | default(false) | bool)

- name: NFTables | acl | Deploy cluster communication rules file
  become: true
  ansible.builtin.template:
    src: rules/cluster.rules.j2
    dest: "{{ __nftables_rules_directory_path }}/20-cluster.rules"
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: nft -c -f %s
  register: __nftables_cluster_rules
  when: >
    (nftables_cluster_enabled | default(false) | bool)

- name: NFTables | acl | Remove cluster communication rules file (if exists)
  become: true
  ansible.builtin.file:
    path: "{{ __nftables_rules_directory_path }}/20-cluster.rules"
    state: absent
  register: __nftables_cluster_rules_removed
  when: >
    not (nftables_cluster_enabled | default(false) | bool)

- name: NFTables | acl | Deploy user-defined rules file
  become: true
  ansible.builtin.template:
    src: rules/user_defined.rules.j2
    dest: "{{ __nftables_rules_directory_path }}/30-user-defined.rules"
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: nft -c -f %s
  register: __nftables_user_defined_rules
  when: >
    (nftables_user_defined_input_enabled | default(false) | bool) or
    (nftables_user_defined_forward_enabled | default(false) | bool) or
    (nftables_user_defined_output_enabled | default(false) | bool)

- name: NFTables | acl | Remove user-defined rules file (if exists)
  become: true
  ansible.builtin.file:
    path: "{{ __nftables_rules_directory_path }}/30-user-defined.rules"
    state: absent
  register: __nftables_user_defined_rules_removed
  when: >
    not (nftables_user_defined_input_enabled | default(false) | bool) and
    not (nftables_user_defined_forward_enabled | default(false) | bool) and
    not (nftables_user_defined_output_enabled | default(false) | bool)

- name: NFTables | acl | Deploy NAT rules file
  become: true
  ansible.builtin.template:
    src: rules/nat.rules.j2
    dest: "{{ __nftables_rules_directory_path }}/40-nat.rules"
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: nft -c -f %s
  register: __nftables_nat_rules
  when: >
    (nftables_nat_prerouting_enabled | default(false) | bool) or
    (nftables_nat_output_enabled | default(false) | bool) or
    (nftables_nat_postrouting_enabled | default(false) | bool)

- name: NFTables | acl | Remove NAT rules file (if exists)
  become: true
  ansible.builtin.file:
    path: "{{ __nftables_rules_directory_path }}/40-nat.rules"
    state: absent
  register: __nftables_nat_rules_removed
  when: >
    not (nftables_nat_prerouting_enabled | default(false) | bool) and
    not (nftables_nat_output_enabled | default(false) | bool) and
    not (nftables_nat_postrouting_enabled | default(false) | bool)

- name: NFTables | acl | Check if inet nftables_nat table exists
  become: true
  ansible.builtin.command: >
    nft list table inet nftables_nat
  register: __nftables_nat_table_check
  failed_when: false
  changed_when: false
  when: >
    (nftables_docker_aware | default(false) | bool) and
    not (nftables_nat_prerouting_enabled | default(false) | bool) and
    not (nftables_nat_output_enabled | default(false) | bool) and
    not (nftables_nat_postrouting_enabled | default(false) | bool)

- name: NFTables | acl | Remove stale inet nftables_nat table
  become: true
  ansible.builtin.command: >
    nft delete table inet nftables_nat
  register: __nftables_nat_table_removed
  failed_when: false
  changed_when: __nftables_nat_table_check.rc | default(1) == 0
  when: >
    (nftables_docker_aware | default(false) | bool) and
    not (nftables_nat_prerouting_enabled | default(false) | bool) and
    not (nftables_nat_output_enabled | default(false) | bool) and
    not (nftables_nat_postrouting_enabled | default(false) | bool) and
    __nftables_nat_table_check.rc | default(1) == 0

- name: NFTables | acl | Deploy base structure file
  become: true
  ansible.builtin.template:
    src: rules/base.rules.j2
    dest: "{{ __nftables_rules_directory_path }}/00-base.rules"
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: nft -c -f %s
  register: __nftables_base_rules

- name: NFTables | acl | Restart and verify nftables service
  when: >
    (__nftables_default_rules_removed.changed | default(false) | bool) or
    (__nftables_base_rules.changed | default(false) | bool) or
    (__nftables_security_rules.changed | default(false) | bool) or
    (__nftables_security_rules_removed.changed | default(false) | bool) or
    (__nftables_cluster_rules.changed | default(false) | bool) or
    (__nftables_cluster_rules_removed.changed | default(false) | bool) or
    (__nftables_user_defined_rules.changed | default(false) | bool) or
    (__nftables_user_defined_rules_removed.changed | default(false) | bool) or
    (__nftables_nat_rules.changed | default(false) | bool) or
    (__nftables_nat_rules_removed.changed | default(false) | bool) or
    (__nftables_nat_table_removed.changed | default(false) | bool)

  block:
    - name: NFTables | acl | Force restart nftables service
      become: true
      ansible.builtin.service:
        name: "{{ __nftables_service_name }}"
        state: restarted

    - name: NFTables | acl | Pause for 5 seconds to load nftables service
      ansible.builtin.pause:
        seconds: 5

    # Justification: 'nftables' is a systemd oneshot service (RemainAfterExit=yes).
    # ansible.builtin.systemd only manages state transitions and cannot query 'is-active',
    # while service_facts reports oneshot units as 'stopped'. 'systemctl is-active' is required.
    - name: NFTables | acl | Verify nftables service status  # noqa: command-instead-of-module
      become: true
      ansible.builtin.command: >
        systemctl is-active {{ __nftables_service_name }}
      failed_when: false
      changed_when: false
      register: __nftables_service_state

    - name: NFTables | acl | Fail if nftables service is not running
      ansible.builtin.fail:
        msg: "nftables service is not running!"
      when: >
        __nftables_service_state.stdout == "inactive" or
        __nftables_service_state.stdout == "failed"
