---
# =============================================================================
# Ansible Role: NFTables - Logrotate Tasks
# =============================================================================
# This file configures log rotation for NFTables log files to ensure they
# don't grow indefinitely and are properly archived.
#
# Flow:
# 1. Installs logrotate package
# 2. Creates the archive directory if it doesn't exist
# 3. Deploys a logrotate configuration file with specified options
#
# The logrotate configuration is customizable via role variables.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Package Installation
# -----------------------------------------------------------------------------
- name: NFTables | logrotate | Install logrotate package
  become: true
  ansible.builtin.package:
    name: logrotate
    state: present

# -----------------------------------------------------------------------------
# 2. Archive Directory Setup
# -----------------------------------------------------------------------------
- name: NFTables | logrotate | Check if archive log directory exists
  become: true
  ansible.builtin.stat:
    path: "{{ nftables_logrotate_options.archive_directory_path }}"
  register: _nftables_archive_log_dir_stat_

- name: NFTables | logrotate | Create archive log directory if needed
  become: true
  ansible.builtin.file:
    path: "{{ nftables_logrotate_options.archive_directory_path }}"
    state: directory
    owner: "{{ __nftables_log_directory_user }}"
    group: "{{ __nftables_log_directory_group }}"
    mode: "0750"
  when: >
    not _nftables_archive_log_dir_stat_.stat.exists

# -----------------------------------------------------------------------------
# 3. Logrotate Configuration
# -----------------------------------------------------------------------------
- name: NFTables | logrotate | Deploy logrotate configuration file
  become: true
  ansible.builtin.template:
    src: "templates/logrotate/nftables.j2"
    dest: "{{ __nftables_logrotate_config_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: logrotate -d %s
