---
# =============================================================================
# Ansible Role: NFTables - Tasks: Log Rotation
# =============================================================================
# Installs and configures logrotate for managing and archiving NFTables log files.
# =============================================================================

- name: NFTables | logrotate | Install logrotate package
  become: true
  ansible.builtin.package:
    name: logrotate
    state: present

- name: NFTables | logrotate | Create archive log directory
  become: true
  ansible.builtin.file:
    path: "{{ nftables_logrotate_options.archive_directory_path }}"
    state: directory
    owner: "{{ __nftables_log_directory_user }}"
    group: "{{ __nftables_log_directory_group }}"
    mode: "0750"

- name: NFTables | logrotate | Deploy logrotate configuration file
  become: true
  ansible.builtin.template:
    src: "logrotate/nftables.j2"
    dest: "{{ __nftables_logrotate_config_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: "{{ nftables_backup_enabled | bool }}"
    validate: logrotate -d %s
