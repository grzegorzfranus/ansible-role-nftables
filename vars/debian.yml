---
# =============================================================================
# Ansible Role: NFTables - Internal Variables (Debian)
# =============================================================================
# Internal constants and computed values.
# These are NOT user-overridable. All use double-underscore prefix per Red Hat CoP — Variable Naming.
#
# Sections:
#   1. Configuration Paths
#   2. Logging Settings
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Configuration Paths
# -----------------------------------------------------------------------------
# Path to the main NFTables configuration file on Debian systems
__nftables_config_path: "/etc/nftables.conf"

# -----------------------------------------------------------------------------
# 2. Logging Settings
# -----------------------------------------------------------------------------
# Path to the system log file on Debian systems
__nftables_system_log_path: "/var/log/syslog"

# User owner for log files and log directory
__nftables_log_directory_user: "root"

# Group owner for log files and log directory
__nftables_log_directory_group: "root"
