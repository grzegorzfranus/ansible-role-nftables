---
# =============================================================================
# Ansible Role: NFTables - Internal Variables
# =============================================================================
# Internal constants and computed values.
# These are NOT user-overridable. All use double-underscore prefix per Red Hat CoP — Variable Naming.
#
# Note: Variables that vary by distribution (__nftables_config_path, __nftables_system_log_path,
# __nftables_log_directory_user, __nftables_log_directory_group) are intentionally defined solely
# in OS-specific variable files (vars/debian.yml, vars/ubuntu.yml, vars/redhat.yml). Their presence
# is validated at runtime by the preflight assertions in tasks/assert.yml.
#
# Sections:
#   1. Service Settings
#   2. Package Settings
#   3. Directory Paths
#   4. Logging Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Service Settings
# -----------------------------------------------------------------------------
# Service name is consistent across most distributions
# Note: This may be overridden in OS-specific vars if needed
__nftables_service_name: "nftables"

# -----------------------------------------------------------------------------
# 2. Package Settings
# -----------------------------------------------------------------------------
# Package name is consistent across most distributions
# Note: This may be overridden in OS-specific vars if needed
__nftables_package_name: "nftables"

# -----------------------------------------------------------------------------
# 3. Directory Paths
# -----------------------------------------------------------------------------
# Standard location for NFTables rule files
__nftables_rules_directory_path: "/etc/nftables"

# Standard location for NFTables log files
__nftables_log_directory_path: "/var/log/nftables"

# -----------------------------------------------------------------------------
# 4. Logging Configuration
# -----------------------------------------------------------------------------
# Path to logrotate configuration file
# This path is standard across most Linux distributions
__nftables_logrotate_config_path: "/etc/logrotate.d/nftables"

# Path to rsyslog configuration file for NFTables
# Using prefix 55- to ensure proper ordering and avoid conflicts with other configs
__nftables_rsyslog_config_path: "/etc/rsyslog.d/55-nftables.conf"
