---
# =============================================================================
# Ansible Role: NFTables - Internal Variables (Ubuntu)
# =============================================================================
# Internal constants and computed values.
# These are NOT user-overridable. All use double-underscore prefix per Red Hat CoP — Variable Naming.
#
# Sections:
#   1. Configuration Paths
#   2. Logging Settings
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Configuration Paths
# -----------------------------------------------------------------------------
# Path to the main NFTables configuration file on Ubuntu systems
__nftables_config_path: "/etc/nftables.conf"

# -----------------------------------------------------------------------------
# 2. Logging Settings
# -----------------------------------------------------------------------------
# Note: On Ubuntu 26.04+ (and Debian 13+), rsyslog is not installed by default
# (journald-only base system). This role explicitly provisions and enables rsyslog
# in tasks/prerequisites.yml, making /var/log/syslog the valid destination.
# Path to the system log file on Ubuntu systems
__nftables_system_log_path: "/var/log/syslog"

# User owner for log files and log directory
# Ubuntu uses syslog user instead of root
__nftables_log_directory_user: "syslog"

# Group owner for log files and log directory
# Ubuntu uses adm group for log access
__nftables_log_directory_group: "adm"
